name: Cofactor Genomics
description: Cofactor Genomics is a precision-medicine biotechnology company that applies
  RNA-sequencing and machine learning to build predictive immuno-oncology diagnostics.
  Its flagship OncoPrism assay is designed to predict which cancer patients will respond
  to immunotherapy, and the company runs the multi-center PREDAPT clinical trial across
  more than 24 healthcare systems spanning 11 solid-tumor cancers. Cofactor Genomics is
  a diagnostics and life-sciences company rather than an API provider; it publishes no
  public developer portal, API documentation, or SDKs. This profile is maintained in the
  API Evangelist network as a company record surfaced from venture-capital portfolios
  (DCVC, Menlo Ventures, Y Combinator) and enriched with identity and domain-security
  metadata.
